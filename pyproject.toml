[project]
name = "hackspora"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lohith889", email = "lohith.24ad@kct.ac.in" }
]
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=4.0.0",
    "chromadb>=1.5.9",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "langchain>=1.4.2",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.3",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "networkx>=3.3",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pymupdf>=1.28.2",
    "pypdf>=6.19.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.2.3",
    "python-jose[cryptography]>=3.3.0",
    "python-levenshtein>=0.25.0",
    "python-multipart>=0.0.9",
    "scikit-learn>=1.4.0",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.0.0",
    "thefuzz>=0.22.1",
    "tiktoken>=0.14.0",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "uvicorn[standard]>=0.28.0",
]

[project.scripts]
hackspora = "hackspora:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
